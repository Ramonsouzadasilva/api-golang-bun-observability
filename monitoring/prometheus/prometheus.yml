global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'prometheus:9090'

  - job_name: 'go-api'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'

  - job_name: 'go-api-pprof'
    metrics_path: '/debug/pprof/profile'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'host.docker.internal:6060'
